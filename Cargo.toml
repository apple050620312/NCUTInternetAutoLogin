[workspace]
members = ["Core", "CLI", "Desktop/src-tauri", "Android/src-tauri", "Android/plugin"]
default-members = ["Core", "CLI"]
resolver = "2"

[workspace.package]
version = "4.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ncut-core = { path = "Core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync"] }
anyhow = "1"

[profile.release]
lto = "thin"
strip = true
